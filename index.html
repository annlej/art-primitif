// ═══════════════════════════════════════════════════════════════
//  TEXTURE SYSTEM — fixed canvas size, DPR-scaled
// ═══════════════════════════════════════════════════════════════
//
//  KEY RULE: canvas is ALWAYS 320×80 CSS px (scaled by DPR for quality).
//  Sprite scale is ALWAYS (base*2.0, base*0.60, 1) — fixed aspect ~3.33.
//  Font size auto-scales down for long words to fit the 300px usable width.
//
const CV_W = 480, CV_H = 96;           // CSS px (fixed) — 5:1 ratio
const SP_AX = 1.50, SP_AY = 0.30;     // sprite scale multipliers (aspect = 5:1 matching canvas)

function tempToColor(t) {
  // cold = #6B7FD4 (blue steel), warm = #C4622D (terracotta)
  const cold = [107, 127, 212], warm = [196, 98, 45];
  const f = t / 100;
  const r = Math.round(cold[0] + f * (warm[0] - cold[0]));
  const g = Math.round(cold[1] + f * (warm[1] - cold[1]));
  const b = Math.round(cold[2] + f * (warm[2] - cold[2]));
  return `rgb(${r},${g},${b})`;
}

// style 0–100: Nunito (round organic) → Outfit (neutral) → Playfair (sharp)
function styleToFontFamily(s) {
  if (s < 35) return "'Nunito', sans-serif";
  if (s < 65) return "'Outfit', sans-serif";
  return "'Playfair Display', serif";
}

function styleToWeight(s, aff) {
  if (aff > 65) return '600';
  if (aff < 35) return '300';
  return '400';
}

// affirmation: poetic = loose + transparent; political = tight + opaque
function affToParams(aff) {
  const letterSpacing = 6 - (aff / 100) * 5;   // 6 → 1 px
  const baseOpacity   = 0.50 + (aff / 100) * 0.50; // 0.50 → 1.0
  return { letterSpacing, baseOpacity };
}

function makeTexture(mot, temp, style, aff) {
  const dpr    = Math.min(window.devicePixelRatio || 1, 2);
  const cv     = document.createElement('canvas');
  cv.width     = CV_W * dpr;
  cv.height    = CV_H * dpr;
  const ctx    = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const color  = tempToColor(temp);
  const family = styleToFontFamily(style);
  const weight = styleToWeight(style, aff);
  const { letterSpacing, baseOpacity } = affToParams(aff);

  // Auto-fit: start at 20px, reduce until text fits in 290px
  let fontSize = 24;
  let measuredW;
  for (let attempt = 0; attempt < 6; attempt++) {
    ctx.font = `${weight} ${fontSize}px ${family}`;
    measuredW = 0;
    for (const ch of mot) measuredW += ctx.measureText(ch).width;
    measuredW += letterSpacing * Math.max(mot.length - 1, 0);
    if (measuredW <= CV_W - 40) break;
    fontSize = Math.max(10, fontSize - 2);
  }

  // Draw text centered vertically and horizontally
  ctx.font         = `${weight} ${fontSize}px ${family}`;
  ctx.textBaseline = 'middle';
  ctx.globalAlpha  = baseOpacity;
  ctx.fillStyle    = color;

  let x = (CV_W - measuredW) / 2;
  for (const ch of mot) {
    ctx.fillText(ch, x, CV_H / 2);
    x += ctx.measureText(ch).width + letterSpacing;
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return { tex, baseOpacity };
}

// ═══════════════════════════════════════════════════════════════
//  WORD DATA & SPRITES
// ═══════════════════════════════════════════════════════════════
const wordData  = {};  // key → { count, temp, style, aff, idx }
const spriteMap = {};  // key → THREE.Sprite

// Logarithmic size: 1 vote → base=0.70, 50 votes → ~1.80 (clamped)
function computeBase(count) {
  return 0.70 + Math.log(Math.min(count, 50)) * 0.28;
}

// Halton-based sphere placement — uniform distribution
function vanDerCorput(n, base) {
  let result = 0, f = 1;
  while (n > 0) { f /= base; result += (n % base) * f; n = Math.floor(n / base); }
  return result;
}
function haltonPos(idx) {
  const az    = (idx * 2.399963) % (Math.PI * 2);  // golden angle azimuth
  const v     = vanDerCorput(idx + 1, 2);            // Van der Corput base-2
  const polar = Math.acos(1 - 2 * v);               // uniform latitude
  const r     = 1.02 + ((idx * 7 + 13) % 17) / 100 * 0.18; // slight variation 1.02–1.20
  const pos   = new THREE.Vector3();
  pos.setFromSphericalCoords(r, polar, az);
  return pos;
}

function addOrUpdate(mot, temp, style, aff, animate) {
  const key = mot.toLowerCase().trim();
  if (!key) return;

  let isNew = false;
  if (!wordData[key]) {
    wordData[key] = { count: 1, temp, style, aff, idx: Object.keys(wordData).length };
    isNew = true;
  } else {
    const d = wordData[key], n = d.count;
    d.temp  = (d.temp  * n + temp)  / (n + 1);
    d.style = (d.style * n + style) / (n + 1);
    d.aff   = (d.aff   * n + aff)   / (n + 1);
    d.count++;
  }

  const d = wordData[key];
  const { tex, baseOpacity } = makeTexture(key, d.temp, d.style, d.aff);
  const base = computeBase(d.count);

  if (!isNew && spriteMap[key]) {
    // Update existing sprite texture + trigger pop
    const sp = spriteMap[key];
    if (sp.material.map) sp.material.map.dispose();
    sp.material.map = tex;
    sp.material.needsUpdate = true;
    sp.userData.base = base;
    sp.userData.baseOp = baseOpacity;
    if (animate) sp.userData.popT = 0;
  } else if (isNew) {
    // Create new sprite
    const mat = new THREE.SpriteMaterial({
      map: tex, transparent: true, opacity: 0, depthWrite: false, depthTest: false
    });
    const sp  = new THREE.Sprite(mat);
    const pos = haltonPos(d.idx);
    sp.position.set(0, -2.5, 0);  // entry from below
    sp.scale.set(base * SP_AX, base * SP_AY, 1);
    sp.userData = { base, baseOp: baseOpacity, finalPos: pos.clone(), entryT: 0, phase: Math.random() * Math.PI * 2 };
    group.add(sp);
    spriteMap[key] = sp;
  }
}

const logEl = document.getElementById('log');

function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60)    return "à l'instant";
  if (s < 3600)  return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return `il y a ${Math.floor(s / 86400)} j`;
}

function addLog(mot, ip, created_at) {
  const el = document.createElement('div');
  el.className = 'log-entry';
  el.innerHTML = `<span class="lw">« ${mot} »</span><br><span class="lip">${ip || '—'}</span><br>${timeAgo(created_at)}`;
  logEl.appendChild(el);
  while (logEl.children.length > 8) logEl.removeChild(logEl.firstChild);
  requestAnimationFrame(() => el.classList.add('visible'));
}

function updateCount() {
  const total  = Object.values(wordData).reduce((s, d) => s + d.count, 0);
  const unique = Object.keys(wordData).length;
  document.getElementById('word-count').textContent =
    `${unique} mots · ${total} contribution${total > 1 ? 's' : ''}`;
}

// ═══════════════════════════════════════════════════════════════
//  LIVE PREVIEW
// ═══════════════════════════════════════════════════════════════
function updatePreview() {
  const mot  = document.getElementById('word-input').value.trim();
  const cont = document.getElementById('word-preview');
  const span = document.getElementById('preview-text');
  if (!mot) { cont.style.opacity = '0'; return; }
  const temp  = +document.getElementById('sl-temp').value;
  const style = +document.getElementById('sl-style').value;
  const aff   = +document.getElementById('sl-aff').value;
  const { letterSpacing, baseOpacity } = affToParams(aff);
  span.textContent         = mot;
  span.style.color         = tempToColor(temp);
  span.style.fontFamily    = styleToFontFamily(style);
  span.style.fontWeight    = styleToWeight(style, aff);
  span.style.letterSpacing = letterSpacing + 'px';
  span.style.opacity       = baseOpacity;
  cont.style.opacity = '1';
}

['word-input','sl-temp','sl-style','sl-aff'].forEach(id =>
  document.getElementById(id).addEventListener('input', updatePreview)
);

// ═══════════════════════════════════════════════════════════════
//  GHOST ANIMATION (mot → sphère)
// ═══════════════════════════════════════════════════════════════
function launchGhost(text, toX, toY) {
  const g = document.createElement('div');
  Object.assign(g.style, {
    position: 'fixed', zIndex: '20', pointerEvents: 'none',
    fontFamily: "'Cormorant Garamond', serif", fontSize: '1rem', fontWeight: '300',
    color: '#1E1E1E', letterSpacing: '0.1em', opacity: '0.75',
    transition: 'left 0.90s cubic-bezier(0.25,0.46,0.45,0.94), top 0.90s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.90s ease'
  });
  g.textContent = text;
  const inp = document.getElementById('word-input').getBoundingClientRect();
  g.style.left = (inp.left + inp.width / 2) + 'px';
  g.style.top  = inp.top + 'px';
  document.body.appendChild(g);
  setTimeout(() => {
    g.style.left    = toX + 'px';
    g.style.top     = toY + 'px';
    g.style.opacity = '0';
  }, 60);
  setTimeout(() => g.remove(), 980);
}

function spriteScreenPos(sp) {
  const wp = sp.position.clone();
  group.localToWorld(wp);
  const pr = wp.clone().project(camera);
  return {
    x: (pr.x * .5 + .5) * innerWidth,
    y: (-pr.y * .5 + .5) * innerHeight
  };
}

function haltonScreenPos(idx) {
  const pos = haltonPos(idx);
  const wp  = pos.clone();
  group.localToWorld(wp);
  const pr  = wp.clone().project(camera);
  return {
    x: (pr.x * .5 + .5) * innerWidth,
    y: (-pr.y * .5 + .5) * innerHeight
  };
}

// ═══════════════════════════════════════════════════════════════
//  INTERACTION
// ═══════════════════════════════════════════════════════════════
let isDrag = false, lx = 0, ly = 0, velX = 0, velY = 0;
renderer.domElement.addEventListener('pointerdown', e => { isDrag = true; lx = e.clientX; ly = e.clientY; velX = velY = 0; });
window.addEventListener('pointerup',   () => { isDrag = false; });
window.addEventListener('pointermove', e => {
  if (!isDrag) return;
  velX = (e.clientX - lx) * 0.009; velY = (e.clientY - ly) * 0.009;
  group.rotation.y += velX; group.rotation.x += velY;
  lx = e.clientX; ly = e.clientY;
});

const raycaster = new THREE.Raycaster();
raycaster.params.Sprite = { threshold: 0.05 };
const mouse2d = new THREE.Vector2(-9999, -9999);
let hovKey = null;

renderer.domElement.addEventListener('mousemove', e => {
  if (isDrag) { mouse2d.set(-9999, -9999); return; }
  const rect = renderer.domElement.getBoundingClientRect();
  mouse2d.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse2d.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
});
renderer.domElement.addEventListener('mouseleave', () => mouse2d.set(-9999, -9999));

function showStatus(msg) {
  statusEl.textContent = msg; statusEl.style.opacity = '1';

async function submitWord() {
  const raw   = document.getElementById('word-input').value.trim();
  const temp  = +document.getElementById('sl-temp').value;
  const style = +document.getElementById('sl-style').value;
  const aff   = +document.getElementById('sl-aff').value;
  if (!raw) return;
  const mot   = raw.toLowerCase().trim();
  const isNew = !wordData[mot];

  // Ghost: for existing words → fly to sprite; for new → fly to future halton pos
  if (!isNew && spriteMap[mot]) {
    const { x, y } = spriteScreenPos(spriteMap[mot]);
    launchGhost(raw, x, y);
  } else {
    const { x, y } = haltonScreenPos(Object.keys(wordData).length);
    launchGhost(raw, x, y);
  }

  addOrUpdate(mot, temp, style, aff, true);
  updateCount();

  // Reset form
  document.getElementById('word-input').value = '';
  document.getElementById('sl-temp').value  = 50;
  document.getElementById('sl-style').value = 50;
  document.getElementById('sl-aff').value   = 50;
  document.getElementById('word-preview').style.opacity = '0';

  const ip = await getIP();
  const ok = await dbInsert(mot, temp, style, aff, ip);
  if (ok) { dbRowCount++; addLog(mot, ip, new Date().toISOString()); showStatus('mot déposé —'); }
  else showStatus('connexion impossible');
}

document.getElementById('submit-btn').addEventListener('click', submitWord);
document.getElementById('word-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitWord(); });

// ═══════════════════════════════════════════════════════════════
//  INIT FROM DB
// ═══════════════════════════════════════════════════════════════
let dbRowCount = 0;

async function initFromDB() {
  try {
    const rows = await dbFetchAll();
    const count = Array.isArray(rows) ? rows.length : 0;

    if (count === 0) {
      // DB vide : afficher seeds localement PUIS insérer en DB
      for (const s of SEEDS) addOrUpdate(s.text, s.temp, s.style, s.aff, false);
      updateCount();
      for (const s of SEEDS) {
        await dbInsert(s.text, s.temp, s.style, s.aff, 'seed');
      }
      dbRowCount = SEEDS.length;
    } else {
      // DB a des données : charger UNIQUEMENT depuis DB (pas de seeds locaux)
      dbRowCount = count;
      const ordered = [...rows].reverse();
      for (const row of ordered) addOrUpdate(row.mot, row.temperature, row.style, row.affirmation, false);
      rows.slice(0, 6).reverse().forEach(r => addLog(r.mot, r.ip_masquee, r.created_at));
      updateCount();
    }
  } catch(e) {
    // DB inaccessible : afficher seeds localement en fallback
    console.warn('DB inaccessible, mode local :', e);
    for (const s of SEEDS) addOrUpdate(s.text, s.temp, s.style, s.aff, false);
    updateCount();
  }
}

setInterval(async () => {
  const rows = await dbFetchAll();
  if (!Array.isArray(rows) || rows.length <= dbRowCount) return;
  const newRows = rows.slice(0, rows.length - dbRowCount).reverse();
  for (const row of newRows) {
    addOrUpdate(row.mot, row.temperature, row.style, row.affirmation, false);
    addLog(row.mot, row.ip_masquee, row.created_at);
  }
  dbRowCount = rows.length;
  updateCount();
}, 15000);

// ═══════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════
let heartT = 0, breathT = 0, lastTs = 0, introDone = false, introT = 0;
const INTRO_DUR = 3.5;

function animate(ts) {
  requestAnimationFrame(animate);
  const dt = Math.min((ts - (lastTs || ts)) / 1000, 0.05);
  lastTs = ts;

  // Intro rotation
  if (!introDone) {
    introT += dt;
    group.rotation.y += 0.010;
    group.rotation.x  = Math.sin(introT * 0.5) * 0.08;
    if (introT >= INTRO_DUR) introDone = true;
  } else if (!isDrag) {
    velX *= 0.91; velY *= 0.91;
    group.rotation.y += 0.0020 + velX;
    group.rotation.x += velY;
    group.rotation.x *= 0.97;
  }

  // Matifi de la sphère — apparaît et s'estompe pendant la rotation (comme avant)
  breathT += dt * 0.38;
  const breathScale = 1 + Math.sin(breathT) * 0.022 + Math.sin(breathT * 1.7) * 0.008;
  sphereMesh.scale.setScalar(breathScale);

  // Respiration méditative — très subtile, cycle lent ~7s, ±0.8%
  heartT += dt * 0.14;
  group.scale.setScalar(1 + Math.sin(heartT) * 0.008);

  // Hover
  raycaster.setFromCamera(mouse2d, camera);
  const allSprites = Object.values(spriteMap);
  const hits = raycaster.intersectObjects(allSprites);
  const hitSp = hits.length ? hits[0].object : null;
  const newHovKey = hitSp ? Object.keys(spriteMap).find(k => spriteMap[k] === hitSp) || null : null;
  if (newHovKey !== hovKey) {
    hovKey = newHovKey;
    renderer.domElement.style.cursor = hovKey ? 'pointer' : 'default';
  }

  const tmpV = new THREE.Vector3();

  // Per-sprite update
  for (const [key, sp] of Object.entries(spriteMap)) {
    const ud   = sp.userData;
    const base = ud.base || 0.70;

    // World-space depth for opacity/scale depth cue
    sp.getWorldPosition(tmpV);
    const t     = Math.max(0, Math.min(1, (tmpV.z + 1.35) / 2.7));
    const dSc   = 0.45 + t * 1.1;   // 0.45 (back) → 1.55 (front)
    const dOp   = 0.08 + t * 0.92;  // 0.08 (back) → 1.00 (front)
    const finalSc = base * dSc;

    // Entry animation (fly up from below)
    if (ud.entryT !== undefined && ud.entryT < 1) {
      ud.entryT = Math.min(ud.entryT + 0.022, 1);
      const e = ud.entryT;
      const ease = e < 0.5 ? 4*e*e*e : 1 - Math.pow(-2*e+2, 3)/2;
      sp.position.lerpVectors(new THREE.Vector3(0, -2.5, 0), ud.finalPos, ease);
      sp.material.opacity = ease * ud.baseOp * dOp;
      if (ud.entryT >= 1) { sp.position.copy(ud.finalPos); delete ud.entryT; delete ud.finalPos; }
    }

    // Pop animation (doublon)
    if (ud.popT !== undefined) {
      ud.popT += 0.038;
      if (ud.popT >= 1) { delete ud.popT; }
      else {
        const pop = 1 + Math.sin(ud.popT * Math.PI) * 0.4 * (1 - ud.popT);
        sp.scale.set(finalSc * pop * SP_AX, finalSc * pop * SP_AY, 1);
        sp.material.opacity = ud.baseOp * dOp;
        continue;
      }
    }

    sp.scale.set(finalSc * SP_AX, finalSc * SP_AY, 1);
    sp.material.opacity = key === hovKey
      ? Math.min(ud.baseOp * 1.4, 1)
      : ud.baseOp * dOp;
  }

  renderer.render(scene, camera);
}

// ─── START ────────────────────────────────────────────────────
document.fonts.ready.then(() => {
  initFromDB();
  requestAnimationFrame(animate);
});
</script>
